<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карточка поста «Покажу»</title>
<link href="../../fonts/fonts.css" rel="stylesheet">
<style>
  /* Вариант Б «Графит», выбран Михаилом 11.10.2026. Размер 1080x1350 (4:5). */
  :root {
    --white:#FFFFFF; --graphite:#1D2329; --before:#9AA3AD; --accent:#3CC6C2;
    --display:"Unbounded", sans-serif; --text:"Onest", sans-serif; --hand:"Caveat", cursive;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; width:1080px; height:1350px; overflow:hidden; }
  body { font-family:var(--text); }
  .card { position:relative; width:1080px; height:1350px; overflow:hidden; background:var(--graphite); color:var(--white); }

  /* Логотип внизу */
  .logo { display:inline-flex; align-items:stretch; font:700 34px/1 var(--display); letter-spacing:-0.02em; color:var(--white); }
  .logo .was { color:var(--before); }
  .logo .cut { width:5px; margin:-5px 6px; border-radius:3px; background:var(--accent); }

  /* Телефон с живым демо */
  .phone { position:absolute; background:#0E1216; border-radius:64px; padding:16px;
           box-shadow:0 0 0 2px #2E3740, 0 40px 120px rgba(60,198,194,.22); }
  .phone .screen { position:relative; width:390px; height:844px; overflow:hidden; border-radius:48px; background:#fff; transform-origin:0 0; }
  .phone iframe { width:390px; height:844px; border:0; display:block; }

  /* «Сейчас»: серая карточка на Картах без сайта (схема, не скриншот) */
  .before-page { width:390px; height:844px; background:#F3F5F7; padding:28px 24px; font-family:var(--text); color:var(--before); }
  .before-page .map { height:300px; border-radius:24px; background:repeating-linear-gradient(35deg,#E3E7EB 0 18px,#EDF0F3 18px 36px); position:relative; }
  .before-page .map::after { content:""; position:absolute; left:50%; top:46%; width:34px; height:34px; margin:-17px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); background:var(--before); }
  .before-page .bar { height:22px; border-radius:11px; background:#DDE2E7; margin-top:22px; }
  .before-page .bar.w60 { width:60%; } .before-page .bar.w80 { width:80%; } .before-page .bar.w40 { width:40%; }
  .before-page .btn { margin-top:30px; height:64px; border-radius:32px; border:3px dashed var(--before); display:grid; place-items:center; font:600 24px/1 var(--text); }

  /* Рукописная пометка */
  .pen { position:absolute; font:600 52px/1.05 var(--hand); color:var(--accent); }
  .pen svg { position:absolute; overflow:visible; }

  .head { position:absolute; left:72px; top:96px; width:936px; }
  .rubric { display:inline-block; padding:14px 26px; border-radius:999px; background:var(--accent); color:var(--graphite);
            font:600 30px/1 var(--text); margin-bottom:34px; }
  h1 { margin:0; font:700 76px/1.08 var(--display); letter-spacing:-0.025em; color:var(--white); }
  .sub { margin:28px 0 0; width:560px; font:400 34px/1.4 var(--text); color:#B8C0C8; }
  .foot { position:absolute; left:72px; bottom:44px; }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
  var DEMOS = "../../demos/";
  var q = new URLSearchParams(location.search);
  var LOGO = '<span class="logo"><span class="was">пока</span><span class="cut"></span><span>жу</span></span>';

  /* Готовые примеры рубрик. Любое поле можно заменить параметром в адресе: rubric, demo, h, sub, pen, pen2 */
  var POSTS = {
    demo:   { layout:"one", rubric:"Демо недели", demo:"shinomontazh",
              h:"Цена шиномонтажа за 10 секунд. Без звонка",
              sub:"Клиент выбирает размер колёс и сразу видит цену и свободное время.",
              pen:"потрогайте сами, ссылка в посте" },
    before: { layout:"two", rubric:"Было - стало", demo:"barbershop",
              h:"Ваш барбершоп сейчас выглядит так. А может так",
              sub:"Слева карточка без сайта, справа демо за 1-2 дня.",
              pen:"сейчас", pen2:"может быть" },
    tip:    { layout:"one", rubric:"Совет для бизнеса", demo:"salon",
              h:"Клиент нашёл вас на Картах и нажал «Сайт». Что он увидел?",
              sub:"Проверьте свою карточку глазами клиента: откройте её с телефона.",
              pen:"проверьте у себя" }
  };
  var P = Object.assign({}, POSTS[q.get("rub") || "demo"]);
  ["rubric", "demo", "h", "sub", "pen", "pen2", "layout"].forEach(function (k) { if (q.get(k) !== null) P[k] = q.get(k); });

  function phone(x, y, scale, demo) {
    var inner = demo === "before"
      ? '<div class="before-page"><div class="map"></div><div class="bar w80"></div><div class="bar w60"></div><div class="bar w40"></div><div class="btn">Сайт не указан</div></div>'
      : '<iframe src="' + DEMOS + demo + '/index.html" scrolling="no"></iframe>';
    var w = 390 * scale + 32, h = 844 * scale + 32;
    return '<div class="phone" style="left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px">' +
           '<div class="screen" style="transform:scale(' + scale + ')">' + inner + '</div></div>';
  }
  function arrow(x, y, w, h, d) {
    return '<svg style="left:' + x + 'px;top:' + y + 'px" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '"><path d="' + d + '" fill="none" stroke="#3CC6C2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  var html = '<div class="head"><div class="rubric">' + P.rubric + '</div><h1>' + P.h + '</h1><p class="sub">' + P.sub + '</p></div>';
  if (P.layout === "two") {
    /* Два телефона: слева «сейчас» (карточка без сайта), справа демо, между ними шторка */
    html += phone(155, 630, 0.69, "before") + phone(655, 630, 0.69, P.demo);
    html += '<div style="position:absolute;left:535px;top:600px;width:10px;height:660px;border-radius:5px;background:var(--accent)"></div>';
    html += '<div class="pen" style="left:250px;top:572px">' + P.pen + '</div><div class="pen" style="left:740px;top:572px">' + P.pen2 + '</div>';
  } else {
    /* Один телефон справа, пометка со стрелкой слева */
    html += phone(620, 600, 0.82, P.demo);
    html += '<div class="pen" style="left:110px;top:930px;width:440px">' + P.pen + arrow(300, 110, 220, 110, "M10 10 C 80 90, 150 100, 210 70 M188 56 L212 70 L192 92") + '</div>';
  }
  html += '<div class="foot">' + LOGO + '</div>';
  document.getElementById("card").innerHTML = html;
</script>
</body>
</html>
